name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA"
        required: true
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          mkdir -p ipa
          url="$(printf '%s' "$IPA_URL" | tr -d '[:space:]')"
          case "$url" in
            http://*|https://*) ;;
            *) echo "::error::ipa_url must be a direct http(s) link to the .ipa"; exit 1 ;;
          esac
          code="$(curl -sSL --retry 3 -o ipa/spotify.ipa -w '%{http_code}' "$url")" || {
            echo "::error::Could not reach the IPA link"; exit 1; }
          if [ "$code" -ge 400 ]; then
            echo "::error::The IPA link returned HTTP $code. Use a direct download link that is still valid (not a share page, not expired, no login needed)."
            exit 1
          fi
          case "$(file --mime-type -b ipa/spotify.ipa)" in
            application/zip|application/x-ios-app) ;;
            *) echo "::error::The link did not return an IPA (got $(file --mime-type -b ipa/spotify.ipa)). It is probably a web page, not a direct download."; exit 1 ;;
          esac

      - run: make release

      - uses: actions/upload-artifact@v5
        if: inputs.upload_method != 'filebin'
        with:
          name: vitrine.ipa
          path: out/*.ipa
          if-no-files-found: error

      - name: Upload to filebin.net
        if: inputs.upload_method != 'artifacts'
        run: |
          BIN="vitrine-${{ github.run_id }}"
          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.ipa; do
            curl -fsS -X POST -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://filebin.net/$BIN/$(basename "$f")" >/dev/null
            echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _filebin deletes bins after a few days of inactivity, download promptly._" >> "$GITHUB_STEP_SUMMARY"
